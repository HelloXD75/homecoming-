<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special Exam</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080a0f;color:#eee;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}.card{width:min(92vw,760px);padding:42px 30px;background:#0d0f15;border:1px solid #777;box-shadow:0 25px 80px #000;text-align:center}.top{letter-spacing:4px;color:#aaa}.line{height:1px;background:#555;margin:18px 0 28px}h1{font-family:Georgia,serif;font-size:clamp(28px,7vw,58px);font-weight:400}h1 span{color:#b51f2a}.quote{font-family:Georgia,serif;font-size:clamp(20px,4vw,30px);line-height:1.45;margin:28px auto}.sub{color:#aaa;font-size:14px;line-height:1.6}.exam{border:1px solid #444;padding:18px;margin:25px 0;background:#0a0c11}button{padding:14px 27px;margin:7px;border-radius:3px;border:1px solid #aaa;background:#eee;color:#111;font-weight:bold;font-size:17px;cursor:pointer}#no{background:#17191f;color:#ddd;border-color:#555}#msg{min-height:28px;margin-top:15px;font-weight:bold;color:#d93642}</style></head><body><div class="card"><div class="top">CLASSROOM OF THE ELITE</div><div class="line"></div><h1>ALONDRA <span>VS.</span> HOMECOMING</h1><div class="exam"><div class="sub">SPECIAL EXAMINATION // 001</div><div class="quote">“Even Ayanokoji couldn't calculate a better strategy than this...”<br><br><span style="color:#d42a36">Will you go to Homecoming with me?</span></div></div><p class="sub">Conditions are simple: choose wisely.<br>There is, of course, only one objectively correct answer.</p><button onclick="yes()">ACCEPT THE EXAM 💗</button><button id="no" onclick="nope()">REJECT 😭</button><div id="msg"></div></div><script>let n=0;function yes(){document.getElementById('msg').textContent='EXAM PASSED. HOMECOMING DATE: CONFIRMED. 💗'}function nope(){n++;let b=document.getElementById('no'),m=['Incorrect answer. Please reconsider.','That choice has been rejected by the exam system.','Ayanokoji is disappointed. 😭','There is only one winning strategy.','FINAL WARNING: PICK ACCEPT. 💗'];document.getElementById('msg').textContent=m[Math.min(n-1,4)];b.style.transform=`translate(${Math.random()*220-110}px,${Math.random()*90-45}px)`}</script></body></html>
